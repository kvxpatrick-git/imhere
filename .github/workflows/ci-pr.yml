name: CI PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      run_integration:
        description: "Run integration smoke tests"
        required: false
        type: boolean
        default: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_gradle: ${{ steps.detect.outputs.has_gradle }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f ./gradlew ]; then
            echo "has_gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gradle=false" >> "$GITHUB_OUTPUT"
          fi

  docs_consistency:
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - run: chmod +x scripts/ci/check_docs_consistency.sh
      - run: scripts/ci/check_docs_consistency.sh

  lint_and_static:
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.has_gradle == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: |
          if ./gradlew tasks --all | rg -q "ktlintCheck"; then
            ./gradlew ktlintCheck
          fi
          if ./gradlew tasks --all | rg -q "detekt"; then
            ./gradlew detekt
          fi
          if ./gradlew tasks --all | rg -q "lintDebug"; then
            ./gradlew lintDebug
          fi
          if ! ./gradlew tasks --all | rg -q "ktlintCheck|detekt|lintDebug"; then
            ./gradlew check
          fi

  architecture_rules:
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.has_gradle == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: |
          if ./gradlew tasks --all | rg -q ":core-domain:test"; then
            ./gradlew :core-domain:test --tests "*Architecture*"
          fi
          if ./gradlew tasks --all | rg -q "checkArchitecture"; then
            ./gradlew checkArchitecture checkForbiddenImports
          fi
      - run: chmod +x scripts/ci/check_architecture_imports.sh
      - run: scripts/ci/check_architecture_imports.sh

  build_and_unit:
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.has_gradle == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: |
          if ./gradlew tasks --all | rg -q "assembleDebug"; then
            ./gradlew assembleDebug
          else
            ./gradlew assemble
          fi

          if ./gradlew tasks --all | rg -q "testDebugUnitTest"; then
            ./gradlew testDebugUnitTest
          else
            ./gradlew test
          fi

  db_migration:
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.has_gradle == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: |
          if ./gradlew tasks --all | rg -q ":core-data:testDebugUnitTest"; then
            ./gradlew :core-data:assembleDebug :core-data:testDebugUnitTest --tests "*Migration*"
          fi
          if ./gradlew tasks --all | rg -q "exportRoomSchema"; then
            ./gradlew :core-data:exportRoomSchema
          fi
      - run: chmod +x scripts/ci/check_room_schema.sh
      - run: scripts/ci/check_room_schema.sh

  security_privacy:
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
      - name: Forbidden log pattern check
        run: |
          ! rg -n "Log\\..*(keyword|phrase|triggered_keyword)" app core-* feature-* platform-* --glob "**/*.kt" \
            || (echo "Forbidden sensitive log pattern found" && exit 1)

  integration_smoke:
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.has_gradle == 'true' && github.event_name == 'workflow_call' && inputs.run_integration == true
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: |
          if ./gradlew tasks --all | rg -q "testDebugUnitTest"; then
            ./gradlew testDebugUnitTest --tests "*Integration*"
          else
            ./gradlew test --tests "*Integration*"
          fi
